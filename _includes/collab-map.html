<style>
#collab-map { --sea:#dfeaf6; --land:#f8fafc; --border:#cbd5e1; --dot:#2563eb; --home:#e11d48; --arc:rgba(37,99,235,.28); --frame:#64748b;
  margin: 4px 0 12px; position: relative }
[data-theme="dark"] #collab-map { --sea:#0d1a2b; --land:#1f2a3a; --border:#2f3e55; --dot:#5b8def; --home:#fb3b63; --arc:rgba(91,141,239,.3); --frame:#8899a6 }
#collab-map svg { display:block; width:100%; height:auto; border-radius:5px }
#collab-map-note { font-size:90%; text-align:center; margin-top:4px }
.collab-list { columns: 2 300px; column-gap: 2em; font-size: 85%; margin: 6px 0 14px }
.collab-list p { margin: 0 0 5px; break-inside: avoid }
</style>
<div id="collab-map" markdown="0">
  <svg viewBox="0 0 960 470" role="img" aria-label="Map of the institutions of my co-authors, with Europe enlarged"></svg>
  <div id="collab-map-note"></div>
</div>
<div class="collab-list" markdown="0">
{% for c in site.data.coauthor_institutions %}<p><strong>{{ c.name }}</strong> ({{ c.city }}, {{ c.country }}; {{ c.works }} joint publication{% if c.works > 1 %}s{% endif %}): {{ c.people | join: ", " }}</p>
{% endfor %}</div>
<script>
(function () {
  const data = {{ site.data.coauthor_institutions | jsonify }};
  const HOME = [5.49, 51.45];  // TU Eindhoven
  const EUROPE = [[-11, 35.5], [31, 63]], INSET = [12, 246, 268, 212];  // lon/lat box; x, y, w, h of the inset in the South Pacific
  const box = document.getElementById('collab-map'), svg = box.querySelector('svg'), NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return parent.appendChild(e);
  };
  const countries = new Set(data.map(d => d.country)).size;
  document.getElementById('collab-map-note').textContent =
    `Institutions of my co-authors: ${data.length} in ${countries} countries, sized by joint publications. Hover over one to see the people.`;
  const ring = () => {  // the Europe box as a line of lon/lat points, so it curves with the projection
    const [[w, s], [e, n]] = EUROPE, pts = [];
    for (let x = w; x <= e; x += 2) pts.push([x, s]);
    for (let x = e; x >= w; x -= 2) pts.push([x, n]);
    return {type: 'LineString', coordinates: [...pts, pts[0]]};
  };

  function layer(g, proj, w, scale) {  // land, arcs from Eindhoven and the institutions, drawn with one projection
    const path = d3.geoPath(proj);
    el('path', {d: path(w.land), fill: 'var(--land)'}, g);
    el('path', {d: path(w.borders), fill: 'none', stroke: 'var(--border)', 'stroke-width': 0.5}, g);
    for (const d of data) el('path', {d: path({type: 'LineString', coordinates: [HOME, [d.lon, d.lat]]}), fill: 'none', stroke: 'var(--arc)', 'stroke-width': 1}, g);
    for (const d of data.slice().reverse()) {  // most joint works last, so on top
      const [x, y] = proj([d.lon, d.lat]);
      const c = el('circle', {cx: x, cy: y, r: scale * (2.5 + 2 * Math.sqrt(d.works)), fill: 'var(--dot)', 'fill-opacity': 0.75, stroke: 'var(--land)', 'stroke-width': 0.8}, g);
      const names = d.people.length > 6 ? d.people.slice(0, 6).join(', ') + ` and ${d.people.length - 6} more` : d.people.join(', ');
      el('title', {}, c).textContent = `${d.name} (${d.city}, ${d.country})\n${d.works} joint publication${d.works > 1 ? 's' : ''}: ${names}`;
    }
    const [hx, hy] = proj(HOME);
    el('title', {}, el('circle', {cx: hx, cy: hy, r: 4, fill: 'var(--home)', stroke: 'var(--land)', 'stroke-width': 1}, g)).textContent = 'TU Eindhoven';
    return path;
  }

  const script = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
  async function draw() {
    if (!window.d3) await script('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js');
    if (!window.topojson) await script('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');
    const atlas = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
    const w = {land: topojson.feature(atlas, atlas.objects.land), borders: topojson.mesh(atlas, atlas.objects.countries, (a, b) => a !== b)};
    // the world
    const world = d3.geoNaturalEarth1().fitExtent([[6, 6], [954, 464]], {type: 'Sphere'});
    el('path', {d: d3.geoPath(world)({type: 'Sphere'}), fill: 'var(--sea)'}, svg);
    const path = layer(el('g', {}, svg), world, w, 1);
    el('path', {d: path(ring()), fill: 'none', stroke: 'var(--frame)', 'stroke-width': 1, 'stroke-dasharray': '3 2'}, svg);
    // Europe, enlarged, in the empty South Pacific
    const [x, y, wd, ht] = INSET, [[lw, ls], [le, ln]] = EUROPE;
    const europe = d3.geoAzimuthalEqualArea().rotate([-(lw + le) / 2, -(ls + ln) / 2])
      .fitExtent([[x + 4, y + 4], [x + wd - 4, y + ht - 4]], {type: 'MultiPoint', coordinates: [[lw, ls], [le, ls], [lw, ln], [le, ln], [(lw + le) / 2, ln], [(lw + le) / 2, ls]]});
    const clip = el('clipPath', {id: 'collab-eu'}, el('defs', {}, svg));
    el('rect', {x, y, width: wd, height: ht, rx: 4}, clip);
    el('rect', {x, y, width: wd, height: ht, rx: 4, fill: 'var(--sea)'}, svg);
    layer(el('g', {'clip-path': 'url(#collab-eu)'}, svg), europe, w, 0.75);
    el('rect', {x, y, width: wd, height: ht, rx: 4, fill: 'none', stroke: 'var(--frame)', 'stroke-width': 1, 'stroke-dasharray': '3 2'}, svg);
    el('text', {x: x + 8, y: y + 16, fill: 'var(--frame)', 'font-size': 12}, svg).textContent = 'Europe';
  }

  let started = false;  // the libraries and the map load only once it scrolls into view
  new IntersectionObserver(([en], obs) => {
    if (en.isIntersecting && !started) { started = true; obs.disconnect(); draw().catch(e => console.error('collaboration map:', e)); }
  }).observe(box);
})();
</script>
