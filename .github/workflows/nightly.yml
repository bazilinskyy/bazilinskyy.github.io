# Every night: rebuilds js/crowd-globe.json (the globe on the home page) and _data/crowd.json
# (the numbers on the research page) from the mapping of github.com/crowd-dataset/crowd; the
# citation counts and co-author institutions from OpenAlex; and the
# open-source cards from GitHub; the places of my talks (map on the talks page); the latest publications in the sidebar from the git history;
# thumbnails of new publication images; then asks GitHub Pages to rebuild the site.
name: Nightly data

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # make_latest_publications.py dates papers by their first commit
          filter: blob:none  # all commits, file contents only when needed
      - run: python3 scripts/make_crowd_globe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/make_latest_publications.py
      - run: python3 scripts/make_openalex.py
        continue-on-error: true  # OpenAlex or GitHub being down must not stop the rest
      - run: python3 scripts/make_bib_data.py
      - run: python3 scripts/make_talk_map.py
        continue-on-error: true  # the geocoder is only asked about new places
      - run: python3 scripts/make_github.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |  # thumbnails of new publication images (the list shows them ~110 px wide)
          python3 -m venv /tmp/thumbs && /tmp/thumbs/bin/pip install -q pillow
          /tmp/thumbs/bin/python scripts/make_thumbs.py
        continue-on-error: true
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/thumbs
          git commit -m 'Update the nightly data' js/crowd-globe.json _data/crowd.json _data/citations.json \
            _data/coauthor_institutions.json _data/citation_stats.json _data/talk_map.json _data/bib.json _data/repos.json _data/latest_publications.json _data/feed_publications.json images/thumbs
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
