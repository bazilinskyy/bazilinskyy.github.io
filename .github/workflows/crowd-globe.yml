# Rebuilds js/crowd-globe.json (the globe on the home page) and _data/crowd.json (the
# numbers on the research page) from the mapping of
# github.com/crowd-dataset/crowd every night and asks GitHub Pages to rebuild the site.
name: CROWD globe

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  globe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/make_crowd_globe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update the CROWD globe' js/crowd-globe.json _data/crowd.json
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
